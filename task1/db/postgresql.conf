# passed to the server as -c config_file=/etc/postgresql/postgresql.conf,
# so it fully replaces the one initdb generated. hba_file/ident_file would
# otherwise default to this file's directory, hence the explicit paths.

data_directory = '/var/lib/postgresql/18/docker'
hba_file = '/var/lib/postgresql/18/docker/pg_hba.conf'
ident_file = '/var/lib/postgresql/18/docker/pg_ident.conf'

listen_addresses = '*'
port = 5432
max_connections = 20
password_encryption = 'scram-sha-256'

shared_buffers = 32MB
effective_cache_size = 128MB
work_mem = 2MB
maintenance_work_mem = 16MB
max_parallel_workers_per_gather = 0
dynamic_shared_memory_type = posix

wal_level = minimal
max_wal_senders = 0
max_wal_size = 256MB
min_wal_size = 64MB
checkpoint_completion_target = 0.9

random_page_cost = 1.1

# libc-resolved, NOT ICU: the image ships only C, C.UTF-8, en_US.UTF-8.
# 'ru_RU.UTF-8' here makes the postmaster refuse to start.
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'

default_text_search_config = 'pg_catalog.russian'
timezone = 'Europe/Moscow'
log_timezone = 'Europe/Moscow'

log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
