name: lse-dpss-task3-2026

# Два сервиса: postgres и клиент. Клиент (TUI) интерактивный, поэтому его
# контейнер простаивает (sleep infinity), а сам клиент запускается через
# docker-compose exec с TTY (make app) — в одной сети с СУБД (п. 6.9).
# Для удобства клиент можно запускать и на хосте (make run).

services:
  db:
    image: postgres:18
    container_name: lse-dpss-task3-2026-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: neobank
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8
        --locale=C.UTF-8
        --locale-provider=icu
        --icu-locale=ru-RU
        --auth-host=scram-sha-256
        --auth-local=scram-sha-256
        --data-checksums
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow

    ports:
      - "${POSTGRES_PORT:-55434}:5432"

    volumes:
      - pgdata:/var/lib/postgresql
      # 01-init.sql, 02-tables.sql, 03-seeds.sql выполняются по порядку при
      # первой инициализации тома (п. 3, 4). ro: образ их только читает.
      - ./app/sql:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d neobank"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    stop_grace_period: 60s

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: lse-dpss-task3-2026-app:0.1.0
    container_name: lse-dpss-task3-2026-app
    depends_on:
      db:
        condition: service_healthy

    # Цель подключения из .env (п. 6.10); host/port переопределяем на сеть
    # compose. Логин и пароль вводятся в приложении (п. 6.6).
    env_file: .env
    environment:
      APP_DB_HOST: db
      APP_DB_PORT: 5432

    volumes:
      - ./logs:/app/logs

    # Контейнер простаивает; клиент запускается через make app.
    command: ["sleep", "infinity"]
    restart: unless-stopped

volumes:
  pgdata:
    name: lse-dpss-task3-2026-pgdata
